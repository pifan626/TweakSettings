name: Build Rootless DEB

on:
  workflow_dispatch:
  push:
    branches:
      - chinese-rootless

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build Rootless package
        run: |
          rm -f Releases/*.deb
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64e

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: TweakSettings-zh_CN-rootless-arm64e
          path: Releases/*.deb
          if-no-files-found: error
