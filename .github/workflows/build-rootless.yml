name: Build Rootless DEB

on:
  workflow_dispatch:
  push:
    branches:
      - chinese-rootless

concurrency:
  group: rootless-deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build Rootless package
        run: |
          rm -f Releases/*.deb
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64e THEOS_PACKAGE_ARCH=iphoneos-arm64e

      - name: Verify arm64e package payload
        run: |
          set -euo pipefail
          deb_count=$(find Releases -maxdepth 1 -name '*.deb' -type f | wc -l | tr -d ' ')
          test "$deb_count" = "1"
          deb=$(find Releases -maxdepth 1 -name '*.deb' -type f -print -quit)
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          dpkg-deb -x "$deb" "$workdir"
          utility="$workdir/usr/bin/tweaksettings-utility"
          test -f "$utility"
          utility_arches=$(lipo -archs "$utility")
          echo "$utility: $utility_arches"
          [[ " $utility_arches " == *" arm64e "* ]]
          package_arch=$(dpkg-deb -f "$deb" Architecture)
          echo "DEB architecture: $package_arch"
          test "$package_arch" = "iphoneos-arm64e"
          dpkg-deb -I "$deb"
          shasum -a 256 "$deb" | tee "$deb.sha256"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: TweakSettings-zh_CN-rootless-arm64e
          path: |
            Releases/*.deb
            Releases/*.deb.sha256
          if-no-files-found: error
